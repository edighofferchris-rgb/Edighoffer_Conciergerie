name: Publier Edighoffer Conciergerie

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Preparer les fichiers du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
